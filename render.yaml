# Render Blueprint for the Prometheus FastAPI backend.
# Creates one free Python web service that serves the /discover SSE endpoint.
services:
  - type: web
    name: prometheus-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # New Render services default to Python 3.14; pin 3.12 for prebuilt
      # wheels of pymatgen / pandas / numpy.
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEFAULT_MODEL_PROVIDER
        value: gemini
      # Prompted for during Blueprint creation. Do not commit real keys.
      - key: GOOGLE_API_KEY
        sync: false
      - key: MP_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
